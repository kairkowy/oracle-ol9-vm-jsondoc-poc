<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSONDoc Lakehouse</title><style>
body{font-family:system-ui,sans-serif;background:#f3f5f8;color:#172033;margin:0}.wrap{max-width:1100px;margin:48px auto;padding:0 24px}h1{margin-bottom:6px}.card{background:white;border-radius:14px;padding:24px;margin:22px 0;box-shadow:0 6px 24px #18243c12}form{display:flex;gap:12px;align-items:center}button{background:#275efe;color:white;border:0;border-radius:8px;padding:10px 18px;font-weight:700}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e6eaf0}td{max-width:260px;overflow-wrap:anywhere}.muted{color:#667085}
</style></head><body><main class="wrap"><h1>JSONDoc Lakehouse</h1><p class="muted">MinIO 원본 파일 · Iceberg 메타정보 · Trino 조회</p>
<section class="card"><h2>JSON 업로드</h2><form action="/upload" method="post" enctype="multipart/form-data"><input type="file" name="file" accept="application/json,.json" required><button>업로드</button></form></section>
<section class="card"><h2>파일 메타정보</h2><table><thead><tr><th>파일</th><th>크기</th><th>문서 ID / 종류</th><th>SHA-256</th><th>업로드 시각</th><th>URI</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{r[1]}}<br><span class="muted">{{r[0]}}</span></td><td>{{r[3]}}</td><td>{{r[7]}} / {{r[8]}}</td><td>{{r[4][:16]}}…</td><td>{{r[5]}}</td><td><a href="{{r[6]}}" target="_blank">열기</a></td></tr>{% else %}<tr><td colspan="6">업로드된 파일이 없습니다.</td></tr>{% endfor %}
</tbody></table></section></main></body></html>
